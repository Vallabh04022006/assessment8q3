apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: department-app

  template:
    metadata:
      labels:
        app: department-app

    spec:
      containers:
      - name: department-app
        image: vallabh04022006/department-app:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: department-service

spec:
  type: NodePort

  selector:
    app: department-app

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30012
